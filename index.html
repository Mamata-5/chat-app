<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatWave — Real-time Chat</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="fas fa-comments"></i></div>
      <h1>ChatWave</h1>
      <p>Connect. Chat. Collaborate.</p>
    </div>
    <div class="login-form">
      <div class="avatar-picker mb-3">
        <p class="text-muted small mb-2">Pick your avatar</p>
        <div class="avatar-options" id="avatarOptions">
          <!-- filled by JS -->
        </div>
      </div>
      <div class="mb-3">
        <input type="text" id="loginName" class="form-control login-input" placeholder="Enter your name" maxlength="20" />
      </div>
      <button id="loginBtn" class="btn btn-primary w-100 login-btn">
        <i class="fas fa-arrow-right me-2"></i>Start Chatting
      </button>
      <p class="login-hint mt-2">Press Enter or click to join</p>
    </div>
  </div>
</div>

<!-- ===== MAIN CHAT APP ===== -->
<div id="chatApp" class="chat-app d-none">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
      <div class="d-flex align-items-center gap-2">
        <div class="user-avatar-sm" id="myAvatarSidebar"></div>
        <div class="flex-grow-1">
          <div class="fw-semibold text-white" id="myNameSidebar">You</div>
          <div class="online-dot-text"><span class="online-dot"></span>Online</div>
        </div>
        <button class="icon-btn-sm" id="settingsBtn" title="Settings"><i class="fas fa-cog"></i></button>
      </div>
    </div>

    <!-- Search -->
    <div class="sidebar-search">
      <div class="search-wrap">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="contactSearch" class="form-control search-input" placeholder="Search chats..." />
      </div>
    </div>

    <!-- Tabs -->
    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="chats">Chats <span class="badge-count" id="unreadTotal">3</span></button>
      <button class="tab-btn" data-tab="groups">Groups</button>
      <button class="tab-btn" data-tab="online">Online</button>
    </div>

    <!-- Contact List -->
    <div class="contact-list" id="contactList"></div>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <button class="icon-btn-sm" title="New Chat" id="newChatBtn"><i class="fas fa-edit"></i></button>
      <button class="icon-btn-sm" title="New Group"><i class="fas fa-users"></i></button>
      <button class="icon-btn-sm" title="Calls"><i class="fas fa-phone"></i></button>
      <button class="icon-btn-sm logout-btn" id="logoutBtn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main class="chat-main" id="chatMain">

    <!-- Welcome Screen (no chat selected) -->
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-content">
        <div class="welcome-icon"><i class="fas fa-comments"></i></div>
        <h2>Welcome to ChatWave</h2>
        <p>Select a conversation from the sidebar to start chatting, or start a new one.</p>
        <button class="btn btn-primary" id="welcomeNewChat">
          <i class="fas fa-plus me-2"></i>New Conversation
        </button>
      </div>
    </div>

    <!-- Active Chat -->
    <div class="active-chat d-none" id="activeChat">

      <!-- Chat Header -->
      <div class="chat-header">
        <button class="back-btn d-md-none" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatHeaderName">Name</div>
          <div class="chat-header-status" id="chatHeaderStatus">Online</div>
        </div>
        <div class="chat-header-actions ms-auto">
          <button class="icon-btn-sm" title="Voice Call" id="voiceCallBtn"><i class="fas fa-phone"></i></button>
          <button class="icon-btn-sm" title="Video Call" id="videoCallBtn"><i class="fas fa-video"></i></button>
          <button class="icon-btn-sm" title="Search in chat"><i class="fas fa-search"></i></button>
          <button class="icon-btn-sm" title="More options" id="moreOptionsBtn"><i class="fas fa-ellipsis-v"></i></button>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="messages-area" id="messagesArea">
        <div class="date-divider"><span>Today</span></div>
      </div>

      <!-- Typing Indicator -->
      <div class="typing-indicator d-none" id="typingIndicator">
        <span class="typing-name" id="typingName">Alice</span> is typing
        <span class="typing-dots"><span></span><span></span><span></span></span>
      </div>

      <!-- Chat Input -->
      <div class="chat-input-area">
        <!-- Emoji Picker -->
        <div class="emoji-picker d-none" id="emojiPicker">
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <div class="input-row">
          <button class="icon-btn-sm attach-btn" title="Attach file"><i class="fas fa-paperclip"></i></button>
          <button class="icon-btn-sm emoji-btn" id="emojiToggle" title="Emoji"><i class="fas fa-smile"></i></button>
          <div class="input-wrap flex-grow-1">
            <textarea id="messageInput" class="form-control msg-input" placeholder="Type a message..." rows="1"></textarea>
          </div>
          <button class="send-btn" id="sendBtn" title="Send">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- RIGHT PANEL: Profile Info (desktop) -->
  <aside class="right-panel d-none" id="rightPanel">
    <div class="right-panel-header">
      <span>Profile Info</span>
      <button class="icon-btn-sm" id="closeRightPanel"><i class="fas fa-times"></i></button>
    </div>
    <div class="right-panel-body" id="rightPanelBody"></div>
  </aside>

</div>

<!-- ===== CALL MODAL ===== -->
<div class="call-modal d-none" id="callModal">
  <div class="call-box">
    <div class="call-avatar" id="callAvatar"></div>
    <div class="call-name" id="callName"></div>
    <div class="call-status" id="callStatus">Calling...</div>
    <div class="call-timer d-none" id="callTimer">00:00</div>
    <div class="call-actions">
      <button class="call-btn mute-btn" id="muteBtn" title="Mute"><i class="fas fa-microphone"></i></button>
      <button class="call-btn end-btn" id="endCallBtn" title="End"><i class="fas fa-phone-slash"></i></button>
      <button class="call-btn speaker-btn" title="Speaker"><i class="fas fa-volume-up"></i></button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="appToast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
